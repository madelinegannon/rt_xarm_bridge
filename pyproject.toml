[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rt_xarm_bridge"
version = "0.1.0"
description = "Realtime servo bridge for UFACTORY xArm and 850 arms: streams joint targets at a fixed cadence behind explicit safety gates, with a hardware-free MockArm."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "ATONATON, LLC" }]
keywords = ["xarm", "ufactory", "robot", "servo", "realtime", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyyaml>=6.0",
    "xarm-python-sdk>=1.13",
]

[project.optional-dependencies]
dev = []

[project.scripts]
rt-xarm-bridge = "rt_xarm_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
